<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 单文件版：双击即可打开，无需网络 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#58CC02">
  <title>Java面试通 · 全栈工程师题库</title>
  <style>
/* ============================================================
   Java面试通 - 多邻国风格移动端样式
   设计：明亮活泼、圆角、大留白、游戏化反馈
   ============================================================ */

/* ---------- 设计令牌 ---------- */
:root {
  --duo-green: #58CC02;
  --duo-green-dark: #46a302;
  --duo-green-bg: #e5f8d6;
  --duo-blue: #1CB0F6;
  --duo-blue-dark: #1899d6;
  --duo-red: #FF4B4B;
  --duo-red-dark: #ea2b2b;
  --duo-orange: #FF9600;
  --duo-purple: #8458FC;
  --duo-yellow: #FFC800;
  --duo-gold: #FFC800;

  --text-dark: #3c3c3c;
  --text-mid: #777;
  --text-light: #afafaf;
  --bg: #f7f7f7;
  --card: #ffffff;
  --border: #e5e5e5;
  --shadow: 0 4px 0 rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden; /* 锁死 html/body，不让它们滚动 */
  background: var(--bg);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  color: var(--text-dark);
  font-size: 15px;
  line-height: 1.5;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul { list-style: none; }

/* 移动端 App 容器 —— 唯一滚动层 */
.app {
  max-width: 480px;
  height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch; /* iOS 惯性滚动 */
  padding-bottom: 72px; /* 底部导航高度 */
}

/* ---------- 顶部状态栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--border);
}
.topbar .brand {
  font-weight: 800;
  font-size: 18px;
  color: var(--duo-green);
  display: flex;
  align-items: center;
  gap: 6px;
}
.topbar .brand .logo { font-size: 22px; }
.topbar .stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 14px;
  font-weight: 700;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 4px;
}
.stat-pill .icon { font-size: 16px; }
.stat-pill.streak { color: var(--duo-orange); }
.stat-pill.gem { color: var(--duo-gold); }
.stat-pill.heart { color: var(--duo-red); }

/* ---------- 视图切换 ---------- */
.view { display: none; }
.view.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none;} }

/* ---------- 学习路径 ---------- */
.hero {
  padding: 16px;
  background: linear-gradient(135deg, var(--duo-green-bg), #d4f0b8);
  border-radius: 0 0 24px 24px;
  margin-bottom: 8px;
}
.hero h2 { font-size: 20px; margin-bottom: 4px; }
.hero p { color: var(--text-mid); font-size: 13px; }

.daily-goal {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 12px;
  box-shadow: var(--shadow);
}
.daily-goal .ring {
  width: 44px; height: 44px;
  flex-shrink: 0;
  transform: rotate(-90deg);
}
.daily-goal .ring circle { fill: none; stroke-width: 6; }
.daily-goal .ring .track { stroke: #e5e5e5; }
.daily-goal .ring .fill { stroke: var(--duo-green); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.daily-goal .ring-label {
  position: absolute; margin-left: 6px;
  font-size: 11px; font-weight: 700; color: var(--duo-green-dark);
}
.daily-goal .goal-text { font-size: 13px; }
.daily-goal .goal-text b { color: var(--text-dark); }
.daily-goal .goal-text span { color: var(--text-mid); font-size: 12px; }

/* 路径节点 */
.path { padding: 12px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.unit { width: 100%; }
.unit-header {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin: 16px 0 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow);
}
.unit-header .u-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  color: #fff;
}
.unit-header .u-title { font-weight: 700; font-size: 15px; }
.unit-header .u-sub { font-size: 12px; color: var(--text-mid); }

.node-row {
  display: flex;
  justify-content: center;
  position: relative;
  width: 100%;
  padding: 10px 0;
}
.node {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--card);
  border: 4px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.node:active { transform: scale(0.95); }
.node .n-icon { font-size: 26px; }
.node .n-title { font-size: 10px; font-weight: 700; margin-top: 2px; max-width: 64px; text-align: center; line-height: 1.1; }
.node.done { background: var(--duo-green); border-color: var(--duo-green-dark); color: #fff; }
.node.done .n-title { color: #fff; }
.node.locked { opacity: 0.5; filter: grayscale(0.6); }
.node.current { border-color: var(--duo-green); animation: pulse 2s infinite; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(88,204,2,0.5); }
  50% { box-shadow: 0 0 0 10px rgba(88,204,2,0); }
}
/* 节点蛇形布局 */
.node-row.left { justify-content: flex-start; padding-left: 14%; }
.node-row.right { justify-content: flex-end; padding-right: 14%; }

/* ---------- 答题视图 ---------- */
.quiz-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 2px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}
.quiz-header .back {
  font-size: 22px;
  color: var(--text-light);
  width: 28px;
}
.quiz-header .progress-bar {
  flex: 1;
  height: 12px;
  background: #e5e5e5;
  border-radius: 999px;
  overflow: hidden;
}
.quiz-header .progress-fill {
  height: 100%;
  background: var(--duo-green);
  border-radius: 999px;
  transition: width .4s;
}
.quiz-header .q-counter {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-mid);
  min-width: 36px;
  text-align: right;
}

.quiz-body {
  padding: 20px 16px 100px;
}
.quiz-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--duo-green-bg);
  color: var(--duo-green-dark);
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 14px;
}
.quiz-question {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 20px;
}

/* 闪卡 */
.flashcard {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}
.flashcard:active { transform: scale(0.98); }
.flashcard .fc-hint {
  font-size: 12px;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 10px;
}
.flashcard .fc-face {
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.flashcard .fc-face.answer { color: var(--duo-green-dark); font-weight: 600; }
.flashcard .fc-tip {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
  font-size: 13px;
  color: var(--duo-orange);
  font-weight: 600;
}
.flip-icon { float: right; font-size: 20px; }

/* 选项卡 */
.options { display: flex; flex-direction: column; gap: 12px; }
.option {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 15px;
  text-align: left;
  box-shadow: var(--shadow);
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.option:active { transform: scale(0.98); }
.option .opt-letter {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 13px;
  color: var(--text-mid);
  flex-shrink: 0;
}
.option.selected {
  border-color: var(--duo-blue);
  background: #ddf4ff;
}
.option.selected .opt-letter { background: var(--duo-blue); color: #fff; }
.option.correct { border-color: var(--duo-green); background: var(--duo-green-bg); }
.option.correct .opt-letter { background: var(--duo-green); color: #fff; }
.option.wrong { border-color: var(--duo-red); background: #ffe5e5; }
.option.wrong .opt-letter { background: var(--duo-red); color: #fff; }

/* 底部操作条 */
.quiz-footer {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: #fff;
  border-top: 2px solid var(--border);
  display: flex;
  gap: 12px;
}
.btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  transition: transform .1s, filter .1s;
}
.btn:active { transform: translateY(2px); }
.btn-primary {
  background: var(--duo-green);
  color: #fff;
  box-shadow: 0 4px 0 var(--duo-green-dark);
}
.btn-primary:disabled {
  background: #ddd;
  box-shadow: 0 4px 0 #bbb;
  color: #fff;
  cursor: not-allowed;
}
.btn-secondary {
  background: #fff;
  color: var(--text-mid);
  border: 2px solid var(--border);
  box-shadow: 0 4px 0 var(--border);
}
.btn-danger {
  background: var(--duo-red);
  color: #fff;
  box-shadow: 0 4px 0 var(--duo-red-dark);
}
.btn-full { flex: 1; }

/* 反馈条 */
.feedback {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  padding: 16px;
  display: none;
  animation: slideUp .25s ease;
}
.feedback.show { display: block; }
@keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0;} to { transform: translate(-50%, 0); opacity:1;} }
.feedback-correct { background: var(--duo-green-bg); color: var(--duo-green-dark); }
.feedback-wrong { background: #ffe5e5; color: var(--duo-red-dark); }
.feedback .fb-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.feedback .fb-detail { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }

/* 结果页 */
.result-screen {
  padding: 40px 24px;
  text-align: center;
}
.result-emoji { font-size: 64px; margin-bottom: 12px; }
.result-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
.result-sub { color: var(--text-mid); margin-bottom: 28px; }
.result-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 28px;
}
.result-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.result-stat .num { font-size: 28px; font-weight: 800; }
.result-stat .lbl { font-size: 12px; color: var(--text-mid); }
.result-stat.xp .num { color: var(--duo-green); }
.result-stat.acc .num { color: var(--duo-blue); }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #fff;
  border-top: 2px solid var(--border);
  display: flex;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 0;
  color: var(--text-light);
  font-size: 11px;
  font-weight: 700;
  gap: 2px;
}
.tab .t-icon { font-size: 22px; }
.tab.active { color: var(--duo-green); }

/* ---------- 个人中心 ---------- */
.profile-header {
  background: linear-gradient(135deg, var(--duo-green), var(--duo-green-dark));
  color: #fff;
  padding: 28px 20px 60px;
  text-align: center;
  position: relative;
}
.profile-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: #fff;
  margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}
.profile-name { font-size: 18px; font-weight: 800; }
.profile-title { font-size: 13px; opacity: 0.9; }

.profile-stats {
  margin: -40px 16px 0;
  background: #fff;
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  justify-content: space-around;
  box-shadow: var(--shadow);
}
.pstat { text-align: center; }
.pstat .num { font-size: 22px; font-weight: 800; }
.pstat .lbl { font-size: 11px; color: var(--text-mid); }

.section-title {
  padding: 20px 16px 10px;
  font-size: 14px;
  font-weight: 800;
  color: var(--text-mid);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.achievements { padding: 0 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ach {
  background: #fff;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
  text-align: center;
}
.ach.locked { opacity: 0.35; filter: grayscale(1); }
.ach .a-icon { font-size: 28px; }
.ach .a-name { font-size: 10px; font-weight: 700; margin-top: 4px; }

.module-progress-list { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.mp-row {
  background: #fff;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
}
.mp-row .mp-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  color: #fff;
  flex-shrink: 0;
}
.mp-row .mp-info { flex: 1; min-width: 0; }
.mp-row .mp-name { font-size: 14px; font-weight: 700; }
.mp-row .mp-bar {
  height: 8px;
  background: #eee;
  border-radius: 999px;
  margin-top: 6px;
  overflow: hidden;
}
.mp-row .mp-fill { height: 100%; border-radius: 999px; transition: width .4s; }
.mp-row .mp-pct { font-size: 12px; font-weight: 700; color: var(--text-mid); min-width: 36px; text-align: right; }

.reset-btn {
  margin: 16px;
  width: calc(100% - 32px);
  padding: 12px;
  border-radius: var(--radius-sm);
  background: #fff;
  border: 2px solid var(--duo-red);
  color: var(--duo-red);
  font-weight: 700;
  font-size: 14px;
}

/* ---------- 通用工具 ---------- */
.empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty .e-icon { font-size: 48px; margin-bottom: 12px; }

/* 每日挑战卡片 */
.daily-card {
  margin: 12px 16px;
  background: linear-gradient(135deg, #fff3d6, #ffe5b8);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.daily-card:active { transform: scale(0.98); }
.daily-card .dc-icon { font-size: 32px; }
.daily-card .dc-text { flex: 1; }
.daily-card .dc-title { font-weight: 800; font-size: 15px; color: #b8651b; }
.daily-card .dc-sub { font-size: 12px; color: #8a5a2b; }
.daily-card .dc-arrow { color: #b8651b; font-size: 20px; }

</style>
</head>
<body>
  <div class="app" id="app">

    <!-- 顶部状态栏（学习页用） -->
    <div class="topbar" id="topbar">
      <div class="brand"><span class="logo">☕</span> Java面试通</div>
      <div class="stats">
        <div class="stat-pill streak"><span class="icon">🔥</span><span id="stat-streak">0</span></div>
        <div class="stat-pill gem"><span class="icon">💎</span><span id="stat-gem">0</span></div>
        <div class="stat-pill heart"><span class="icon">❤️</span><span id="stat-heart">5</span></div>
      </div>
    </div>

    <!-- ============ 视图1：学习路径 ============ -->
    <div class="view active" id="view-learn">
      <div class="hero">
        <h2 id="hero-greeting">准备好刷题了吗？</h2>
        <p>每天5分钟，吃透Java全栈面试高频题</p>
        <div class="daily-goal">
          <div style="position:relative;">
            <svg class="ring" width="44" height="44" viewBox="0 0 44 44">
              <circle class="track" cx="22" cy="22" r="18"></circle>
              <circle class="fill" id="goal-ring" cx="22" cy="22" r="18"
                stroke-dasharray="113" stroke-dashoffset="113"></circle>
            </svg>
            <span class="ring-label" id="goal-pct">0%</span>
          </div>
          <div class="goal-text">
            <b id="goal-done">0</b> / <span id="goal-total">10</span> 题 · 今日目标
          </div>
        </div>
      </div>

      <!-- 每日挑战 -->
      <div class="daily-card" id="daily-card">
        <div class="dc-icon">🎯</div>
        <div class="dc-text">
          <div class="dc-title">每日挑战</div>
          <div class="dc-sub">随机抽题，检验今日学习成果</div>
        </div>
        <div class="dc-arrow">›</div>
      </div>

      <!-- 学习路径（动态渲染） -->
      <div class="path" id="path"></div>
    </div>

    <!-- ============ 视图2：答题 ============ -->
    <div class="view" id="view-quiz">
      <div class="quiz-header" id="quiz-header">
        <button class="back" id="quiz-back">✕</button>
        <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
        <div class="q-counter" id="q-counter">1/5</div>
      </div>
      <div class="quiz-body" id="quiz-body">
        <!-- 动态渲染题目 -->
      </div>

      <!-- 反馈条 -->
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fb-title"></div>
        <div class="fb-detail" id="fb-detail"></div>
      </div>

      <!-- 底部操作 -->
      <div class="quiz-footer" id="quiz-footer">
        <button class="btn btn-secondary" id="btn-skip">跳过</button>
        <button class="btn btn-primary" id="btn-check" disabled>检查</button>
      </div>
    </div>

    <!-- ============ 视图3：个人中心 ============ -->
    <div class="view" id="view-profile">
      <div class="profile-header">
        <div class="profile-avatar">👨‍💻</div>
        <div class="profile-name">Java 全栈工程师</div>
        <div class="profile-title" id="profile-title">Lv.1 入门菜鸟</div>
      </div>

      <div class="profile-stats">
        <div class="pstat"><div class="num" id="p-xp">0</div><div class="lbl">总经验</div></div>
        <div class="pstat"><div class="num" id="p-done">0</div><div class="lbl">已答题</div></div>
        <div class="pstat"><div class="num" id="p-acc">0%</div><div class="lbl">正确率</div></div>
      </div>

      <div class="section-title">成就徽章</div>
      <div class="achievements" id="achievements"></div>

      <div class="section-title">模块进度</div>
      <div class="module-progress-list" id="module-progress"></div>

      <button class="reset-btn" id="btn-reset">重置学习进度</button>
    </div>

    <!-- ============ 底部导航 ============ -->
    <div class="tabbar">
      <button class="tab active" data-view="learn">
        <span class="t-icon">🏠</span><span>学习</span>
      </button>

const STORAGE_KEY = "java_interview_app_v1";
const DAILY_GOAL = 10; // 每日目标题数

// ---------- 状态管理 ----------
let state = loadState();

function defaultState() {
  return {
    xp: 0,
    gems: 0,
    hearts: 5,
    streak: 0,
    lastActiveDate: null,
    todayAnswered: 0,
    todayDate: todayStr(),
    totalAnswered: 0,
    correctCount: 0,
    completedLessons: {},   // lessonId -> true
    answeredQuestions: {},  // questionKey -> true (用于模块进度)
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      // 跨日重置今日数据
      if (s.todayDate !== todayStr()) {
        // 连续打卡判定
        if (s.lastActiveDate === yesterdayStr()) {
          s.streak = (s.streak || 0) + 1;
        } else if (s.lastActiveDate !== todayStr()) {
          s.streak = s.todayAnswered > 0 ? 1 : 0;
        }
        s.todayDate = todayStr();
        s.todayAnswered = 0;
      }
      return { ...defaultState(), ...s };
    }
  } catch (e) { console.warn(e); }
  return defaultState();
}

function saveState() {
  state.lastActiveDate = todayStr();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// ---------- 工具 ----------
function $(sel, root = document) { return root.querySelector(sel); }
function $(sel, root = document) { return [...root.querySelectorAll(sel)]; }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getLevel(xp) {
  // 每100xp升一级
  const lv = Math.floor(xp / 100) + 1;
  const titles = ["入门菜鸟", "初级开发", "中级工程师", "高级工程师", "架构师", "技术专家", "技术大牛"];
  return { lv, title: titles[Math.min(lv - 1, titles.length - 1)] };
}

// ---------- 视图路由 ----------
function showView(name) {
  $(".view").forEach(v => v.classList.remove("active"));
  $(`#view-${name}`).classList.add("active");
  $(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === name));
  $("#topbar").style.display = name === "learn" ? "flex" : "none";
  // 答题视图隐藏底部导航（有自己的操作条）
  $(".tabbar").style.display = name === "quiz" ? "none" : "flex";
  document.querySelector(".app").scrollTop = 0;
}

$(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    const v = tab.dataset.view;
    if (v === "profile") renderProfile();

  });
});

  $("#stat-streak").textContent = state.streak;

  $("#goal-total").textContent = DAILY_GOAL;
  $("#goal-pct").textContent = goalPct + "%";
  const circumference = 2 * Math.PI * 18;
  $("#goal-ring").setAttribute("stroke-dasharray", circumference);
  $("#goal-ring").setAttribute("stroke-dashoffset", circumference * (1 - goalPct / 100));

  // 问候语
  const h = new Date().getHours();
  const greet = h < 6 ? "夜深了，注意休息" : h < 12 ? "早上好，开始刷题吧" : h < 14 ? "午后好，刷几道题醒醒脑" : h < 18 ? "下午好，继续加油" : "晚上好，复盘今日所学";
  $("#hero-greeting").textContent = greet;

  // 路径
  const path = $("#path");
  path.innerHTML = "";

  // 找到第一个未完成的lesson（当前节点）
  const allLessons = [];
  QUESTION_BANK.forEach(m => m.lessons.forEach(l => allLessons.push({ ...l, module: m.module, icon: m.icon, color: m.color })));
  let currentFound = false;

  QUESTION_BANK.forEach((module, mi) => {
    // 单元标题
    const unit = document.createElement("div");
    unit.className = "unit";
    const doneInModule = module.lessons.filter(l => state.completedLessons[l.id]).length;
    unit.innerHTML = `
      <div class="unit-header">
        <div class="u-icon" style="background:${module.color}">${module.icon}</div>
        <div>
          <div class="u-title">${module.module}</div>
          <div class="u-sub">${doneInModule}/${module.lessons.length} 关已通过</div>
        </div>
      </div>
    `;
    path.appendChild(unit);

    // 每个lesson一个节点，蛇形排列
    module.lessons.forEach((lesson, li) => {
      const row = document.createElement("div");
      row.className = "node-row " + (li % 2 === 0 ? "left" : "right");

      const isDone = !!state.completedLessons[lesson.id];
      // 锁定条件：上一课未完成（同一模块内）
      let isLocked = false;
      if (!isDone) {
        if (li > 0) {
          isLocked = !state.completedLessons[module.lessons[li - 1].id];
        }
        // 第一个模块的第一课不锁
      }
      const isCurrent = !isDone && !isLocked && !currentFound;
      if (isCurrent) currentFound = true;

      const node = document.createElement("div");
      node.className = "node" + (isDone ? " done" : "") + (isLocked ? " locked" : "") + (isCurrent ? " current" : "");
      node.innerHTML = `
        <div class="n-icon">${isDone ? "⭐" : lesson.icon || module.icon}</div>
        <div class="n-title">${lesson.title}</div>
      `;
      if (!isLocked) {
        node.addEventListener("click", () => startLesson(lesson, module));
      } else {
        node.innerHTML += `<div style="position:absolute;font-size:18px;top:-4px;right:-4px;">🔒</div>`;
      }
      row.appendChild(node);
      path.appendChild(row);
    });
  });
}

// ---------- 答题流程 ----------
let quiz = null; // 当前答题会话

function startLesson(lesson, module) {
  const questions = shuffle(lesson.questions);
  quiz = {
    type: "lesson",
    module,
    lesson,
    questions,
    index: 0,
    correct: 0,
    startedAt: Date.now(),
    answeredKeys: [],
  };
  $("#quiz-header").style.display = "flex";
  showView("quiz");
  renderQuestion();
}

function startDailyChallenge() {
  const all = getAllQuestions();
  const pool = shuffle(all).slice(0, 10);
  quiz = {
    type: "daily",
    module: null,
    lesson: { title: "每日挑战" },
    questions: pool,
    index: 0,
    correct: 0,
    startedAt: Date.now(),
    answeredKeys: [],
  };
  $("#quiz-header").style.display = "flex";
  showView("quiz");
  renderQuestion();
}

$("#daily-card").addEventListener("click", startDailyChallenge);

function renderQuestion() {
  const q = quiz.questions[quiz.index];
  const total = quiz.questions.length;
  $("#quiz-progress").style.width = `${(quiz.index / total) * 100}%`;
  $("#q-counter").textContent = `${quiz.index + 1}/${total}`;

  const body = $("#quiz-body");
  hideFeedback();

  if (q.type === "flashcard") {
    body.innerHTML = `
      <div class="quiz-badge">${quiz.module ? quiz.module.module : "🎯 每日挑战"} · 闪卡</div>
      <div class="quiz-question">${q.q}</div>
      <div class="flashcard" id="flashcard">
        <span class="flip-icon">🔄</span>
        <div class="fc-hint">点击卡片查看答案</div>
        <div class="fc-face question" id="fc-face">${q.a.split("\n")[0]}</div>
      </div>
    `;
    let flipped = false;
    const card = $("#flashcard");
    const face = $("#fc-face");
    card.addEventListener("click", () => {
      flipped = !flipped;
      if (flipped) {
        face.classList.add("answer");
        face.innerHTML = q.a.replace(/\n/g, "<br>") +
          (q.tip ? `<div class="fc-tip">💡 ${q.tip}</div>` : "");
        $(".fc-hint", card).textContent = "已显示答案";
      } else {
        face.classList.remove("answer");
        face.innerHTML = q.a.split("\n")[0];
        $(".fc-hint", card).textContent = "点击卡片查看答案";
      }
    });
    // 闪卡：按钮显示"我记住了"
    $("#btn-check").textContent = "记住了";
    $("#btn-check").disabled = false;
  } else if (q.type === "choice") {
    const letters = ["A", "B", "C", "D"];
    body.innerHTML = `
      <div class="quiz-badge">${quiz.module ? quiz.module.module : "🎯 每日挑战"} · 选择题</div>
      <div class="quiz-question">${q.q}</div>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="option" data-i="${i}">
            <span class="opt-letter">${letters[i]}</span>
            <span>${opt}</span>
          </button>
        `).join("")}
      </div>
    `;
    $(".option").forEach(opt => {
      opt.addEventListener("click", () => selectOption(opt));
    });
    $("#btn-check").textContent = "检查";
    $("#btn-check").disabled = true;
    quiz.selected = null;
  }

  // 重置反馈条和按钮
  $("#quiz-footer").style.display = "flex";
  $("#btn-skip").textContent = "跳过";
  $("#btn-skip").style.display = "block";
  $("#btn-check").onclick = checkHandler;
}

function selectOption(opt) {
  if (quiz.answered) return;
  $(".option").forEach(o => o.classList.remove("selected"));
  opt.classList.add("selected");
  quiz.selected = parseInt(opt.dataset.i);
  $("#btn-check").disabled = false;
}

function checkHandler() {
  if (quiz.answered) return;
  const q = quiz.questions[quiz.index];
  if (q.type === "flashcard") {
    quiz.correct++;
    state.correctCount++;
    showFeedback(true, "记住啦！", q.tip ? `💡 ${q.tip}` : "继续保持！");
    markAnswered(q);
  } else if (q.type === "choice") {
    if (quiz.selected === q.answer) {
      quiz.correct++;
      state.correctCount++;
      $(".option")[quiz.selected].classList.add("correct");
      showFeedback(true, "回答正确！", q.tip ? `💡 ${q.tip}` : "太棒了！");
    } else {
      $(".option")[quiz.selected].classList.add("wrong");
      $(".option")[q.answer].classList.add("correct");
      const correctText = q.options[q.answer];
      showFeedback(false, "答错了～", `正确答案：${correctText}\n${q.tip ? "💡 " + q.tip : ""}`);
      state.hearts = Math.max(0, state.hearts - 1);
      $("#stat-heart").textContent = state.hearts;
    }
    markAnswered(q);
  }
  quiz.answered = true;
  $("#btn-check").textContent = "继续";
  $("#btn-check").onclick = nextQuestion;
  $("#btn-skip").style.display = "none";
}

function markAnswered(q) {
  state.totalAnswered++;
  state.todayAnswered++;
  const key = `${quiz.module ? quiz.module.module : "daily"}::${q.q}`;
  state.answeredQuestions[key] = true;
  // 经验值
  state.xp += 10;
  if (state.todayAnswered % 5 === 0) state.gems += 1;
  saveState();
}

function nextQuestion() {
  if (quiz.transitioning) return;
  quiz.transitioning = true;
  quiz.index++;
  quiz.answered = false;
  if (quiz.index >= quiz.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
  quiz.transitioning = false;
}

$("#btn-skip").addEventListener("click", () => {
  const q = quiz.questions[quiz.index];
  state.totalAnswered++;
  state.todayAnswered++;
  saveState();
  nextQuestion();
});

$("#quiz-back").addEventListener("click", () => {
  if (confirm("确定要退出本次学习吗？进度将不会保存为通关。")) {
    showView("learn");
    renderLearn();
  }
});

function showFeedback(correct, title, detail) {
  const fb = $("#feedback");
  fb.className = "feedback show " + (correct ? "feedback-correct" : "feedback-wrong");
  $("#fb-title").innerHTML = (correct ? "✅" : "❌") + " " + title;
  $("#fb-detail").textContent = detail;
  // 震动反馈（如支持）
  if (navigator.vibrate) navigator.vibrate(correct ? 20 : [30, 30, 30]);
}

function hideFeedback() {
  $("#feedback").classList.remove("show");
}

function finishQuiz() {
  const total = quiz.questions.length;
  const acc = Math.round(quiz.correct / total * 100);
  const xpGained = quiz.correct * 10 + (acc === 100 ? 20 : 0);
  state.xp += xpGained;
  if (quiz.type === "lesson" && acc >= 60) {
    state.completedLessons[quiz.lesson.id] = true;
    state.gems += 5;
  }
  saveState();

  const body = $("#quiz-body");
  $("#quiz-header").style.display = "none";
  $("#quiz-footer").style.display = "none";
  hideFeedback();

  const emoji = acc === 100 ? "🏆" : acc >= 80 ? "🎉" : acc >= 60 ? "👍" : "💪";
  const title = acc === 100 ? "完美通关！" : acc >= 80 ? "表现优秀！" : acc >= 60 ? "通过！" : "继续加油！";
  const sub = acc >= 60 ? "已解锁下一关" : "未达60%，建议复习后再来";

  body.innerHTML = `
    <div class="result-screen">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${quiz.lesson.title} · ${sub}</div>
      <div class="result-stats">
        <div class="result-stat xp"><div class="num">+${xpGained}</div><div class="lbl">经验</div></div>
        <div class="result-stat acc"><div class="num">${acc}%</div><div class="lbl">正确率</div></div>
        <div class="result-stat"><div class="num">${quiz.correct}/${total}</div><div class="lbl">答对</div></div>
      </div>
      <div style="display:flex;gap:12px;">
        <button class="btn btn-secondary" id="btn-home">返回首页</button>
        <button class="btn btn-primary" id="btn-retry">再来一次</button>
      </div>
    </div>
  `;

  $("#btn-home").onclick = () => { showView("learn"); renderLearn(); };
  $("#btn-retry").onclick = () => {
    $("#quiz-header").style.display = "flex";
    if (quiz.type === "daily") startDailyChallenge();
    else startLesson(quiz.lesson, quiz.module);
  };
}

// ---------- 个人中心 ----------
function renderProfile() {
  const { lv, title } = getLevel(state.xp);
  $("#profile-title").textContent = `Lv.${lv} ${title}`;
  $("#p-xp").textContent = state.xp;
  $("#p-done").textContent = state.totalAnswered;
  $("#p-acc").textContent = state.totalAnswered ? Math.round(state.correctCount / state.totalAnswered * 100) + "%" : "0%";

  // 成就
  const achs = [
    { icon: "🌱", name: "初出茅庐", cond: state.totalAnswered >= 1 },
    { icon: "🔥", name: "连续7天", cond: state.streak >= 7 },
    { icon: "💯", name: "百分达人", cond: state.totalAnswered >= 100 },
    { icon: "⭐", name: "首个通关", cond: Object.keys(state.completedLessons).length >= 1 },
    { icon: "🏅", name: "通关达人", cond: Object.keys(state.completedLessons).length >= 5 },
    { icon: "👑", name: "全栈大师", cond: Object.keys(state.completedLessons).length >= 10 },
    { icon: "💎", name: "宝石猎人", cond: state.gems >= 10 },
    { icon: "🎯", name: "神射手", cond: state.totalAnswered >= 50 && (state.correctCount / state.totalAnswered) >= 0.9 },
  ];
  $("#achievements").innerHTML = achs.map(a => `
    <div class="ach ${a.cond ? "" : "locked"}">
      <div class="a-icon">${a.icon}</div>
      <div class="a-name">${a.name}</div>
    </div>
  `).join("");

  // 模块进度
  $("#module-progress").innerHTML = QUESTION_BANK.map(m => {
    const totalQ = m.lessons.reduce((s, l) => s + l.questions.length, 0);
    const doneLessons = m.lessons.filter(l => state.completedLessons[l.id]).length;
    const pct = Math.round(doneLessons / m.lessons.length * 100);
    return `
      <div class="mp-row">
        <div class="mp-icon" style="background:${m.color}">${m.icon}</div>
        <div class="mp-info">
          <div class="mp-name">${m.module}</div>
          <div class="mp-bar"><div class="mp-fill" style="width:${pct}%;background:${m.color}"></div></div>
        </div>
        <div class="mp-pct">${pct}%</div>
      </div>
    `;
  }).join("");
}

// ---------- 重置 ----------
$("#btn-reset").addEventListener("click", () => {
  if (confirm("确定要重置所有学习进度吗？此操作不可恢复。")) {
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState();
    saveState();
    renderProfile();
    alert("进度已重置");
  }
});

// ---------- 初始化 ----------
renderLearn();

</script>
</body>
